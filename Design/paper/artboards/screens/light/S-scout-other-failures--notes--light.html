<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scout · Other failures · Notes</title>
<link rel="stylesheet" href="../../../tokens.css">
</head>
<body style="margin:0;background:var(--color-canvas-artboard)">
<div layer-name="Scout · Other failures · Notes" data-artboard style="box-sizing:border-box;width:320px;height:184px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--color-canvas-artboard)">
<div layer-name="Notes" style="box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:16px">
<div layer-name="Note / Note" style="box-sizing:border-box;display:flex;flex-direction:column;gap:var(--spacing-xs);padding:var(--spacing-md);flex-shrink:0;width:288px;background:var(--color-canvas-note-background);border:1px solid var(--color-canvas-note-border);border-radius:var(--radius-control)">
<div layer-name="Note Title" style="box-sizing:border-box;font-family:var(--font-sans);font-size:var(--text-subheadline);font-weight:var(--font-weight-semibold);line-height:var(--leading-subheadline);color:var(--color-canvas-note-text)">Note</div>
<div layer-name="Note Body" style="box-sizing:border-box;font-family:var(--font-sans);font-size:var(--text-subheadline);font-weight:var(--font-weight-regular);line-height:var(--leading-subheadline);color:var(--color-canvas-note-text)">The four &quot;other failure&quot; empty states share one layout, so they are shown together in a 2 x 2 grid with a label each (labels are annotations, not UI). In the app each fills the content area alone, with the request bar shown except for &quot;unavailable&quot;.</div>
</div>
</div>
</div>
</body>
</html>
