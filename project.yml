name: Iter
options:
  bundleIdPrefix: com.dwjames
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: VF945J28YU
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Versioning (docs/DISTRIBUTION.md). MARKETING_VERSION is the one place the version lives: semantic, 0.x.y until
    # the first signed release, which is 1.0.0. scripts/bump.sh and scripts/release.sh change it.
    MARKETING_VERSION: "0.1.0"
    # The build number is the commit count on main, passed in by the scripts (scripts/version.sh). 0 = built
    # outside the scripts (for example from Xcode), so it never outranks a released build.
    CURRENT_PROJECT_VERSION: "0"
    ITER_GIT_COMMIT: ""
    # In-app updates (IterUpdater). The feed is the latest GitHub Release's appcast.json asset; the public key
    # verifies each update's Ed25519 signature. scripts/release.sh writes the key the first time it runs.
    ITER_UPDATE_FEED_URL: "https://github.com/dwjames88/iter/releases/latest/download/appcast.json"
    ITER_UPDATE_PUBLIC_KEY: ""
packages:
  IterKit:
    path: Packages/IterKit
  IterUpdater:
    path: Packages/IterUpdater
targets:
  Iter:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: IterKit
        product: IterCore
      - package: IterKit
        product: IterAstro
      - package: IterKit
        product: IterLight
      - package: IterKit
        product: IterData
      - package: IterKit
        product: IterServices
      - package: IterKit
        product: IterDesign
      - package: IterKit
        product: IterFeatures
      - package: IterUpdater
        product: IterUpdater
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwjames.iter
        PRODUCT_NAME: Iter
        INFOPLIST_FILE: App/Info.plist
        # Default build has no WeatherKit entitlement: the Personal Team cannot provision it.
        # scripts/run.sh --weatherkit (or ITER_ENTITLEMENTS=App/Iter-WeatherKit.entitlements) switches it on.
        ITER_ENTITLEMENTS: App/Iter.entitlements
        CODE_SIGN_ENTITLEMENTS: $(ITER_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
  IterAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: Iter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwjames.iter.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Iter.app/Contents/MacOS/Iter
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Iter:
    build:
      targets:
        Iter: all
        IterAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IterAppTests
