name: Iter
options:
  bundleIdPrefix: com.dwjames
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: VF945J28YU
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
packages:
  IterKit:
    path: Packages/IterKit
targets:
  Iter:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: IterKit
        product: IterCore
      - package: IterKit
        product: IterAstro
      - package: IterKit
        product: IterLight
      - package: IterKit
        product: IterData
      - package: IterKit
        product: IterServices
      - package: IterKit
        product: IterDesign
      - package: IterKit
        product: IterFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwjames.iter
        PRODUCT_NAME: Iter
        INFOPLIST_FILE: App/Info.plist
        # Default build has no WeatherKit entitlement: the Personal Team cannot provision it.
        # scripts/run.sh --weatherkit (or ITER_ENTITLEMENTS=App/Iter-WeatherKit.entitlements) switches it on.
        ITER_ENTITLEMENTS: App/Iter.entitlements
        CODE_SIGN_ENTITLEMENTS: $(ITER_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
  IterAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: Iter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwjames.iter.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Iter.app/Contents/MacOS/Iter
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Iter:
    build:
      targets:
        Iter: all
        IterAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IterAppTests
