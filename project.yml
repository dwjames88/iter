name: Iter
# The iPhone and iPad app lives in its own spec (targets, scheme, iOS deployment target).
include:
  - project-ios.yml
# "Test" is a Debug build that can only ever be the render copy: the scheme's test action uses it, so `xcodebuild test`
# hosts the tests in com.dwjames.iter.render (ad hoc, no team, no hardened runtime) and never in the real app.
configs:
  Debug: debug
  Release: release
  Test: debug
options:
  bundleIdPrefix: com.dwjames
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: VF945J28YU
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Versioning (docs/DISTRIBUTION.md). MARKETING_VERSION is the one place the version lives: semantic, 0.x.y until
    # the first signed release, which is 1.0.0. scripts/bump.sh and scripts/release.sh change it.
    MARKETING_VERSION: "0.2.0"
    # The build number is the commit count on main, passed in by the scripts (scripts/version.sh). 0 = built
    # outside the scripts (for example from Xcode), so it never outranks a released build.
    CURRENT_PROJECT_VERSION: "0"
    ITER_GIT_COMMIT: ""
    # The Mac app's bundle id. scripts/render.sh and scripts/snapshots.sh override it with com.dwjames.iter.render so a render or
    # test copy never runs as the real app (it then keeps off the Keychain and the real store: see RenderCopy).
    ITER_BUNDLE_ID: com.dwjames.iter
    # In-app updates (IterUpdater). The feed is the latest GitHub Release's appcast.json asset; the public key
    # verifies each update's Ed25519 signature. scripts/release.sh writes the key the first time it runs.
    ITER_UPDATE_FEED_URL: "https://github.com/dwjames88/iter/releases/latest/download/appcast.json"
    ITER_UPDATE_PUBLIC_KEY: "LndqHR3Ss6ptV4nD6v+N3wOc+TigG1VTuE2T+AZY48c="
    # Keep the build machine's paths out of the binary: source paths are recorded relative to /Iter.
    OTHER_SWIFT_FLAGS: $(inherited) -file-prefix-map $(SRCROOT)=/Iter -debug-prefix-map $(SRCROOT)=/Iter
  configs:
    Test:
      ITER_BUNDLE_ID: com.dwjames.iter.render
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # Strip symbols from the shipped app.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      COPY_PHASE_STRIP: YES
packages:
  Iter:
    path: Packages/Iter
  IterUpdater:
    path: Packages/IterUpdater
targets:
  Iter:
    type: application
    platform: macOS
    sources:
      - path: Mac/Sources
      - path: Mac/Resources
    dependencies:
      - package: Iter
        product: IterScreens
      - package: Iter
        product: IterFeatures
      - package: Iter
        product: IterUI
      - package: Iter
        product: IterModel
      - package: Iter
        product: IterStore
      - package: Iter
        product: IterSources
      - package: Iter
        product: IterDiscovery
      - package: Iter
        product: IterSky
      - package: IterUpdater
        product: IterUpdater
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITER_BUNDLE_ID)
        PRODUCT_NAME: Iter
        INFOPLIST_FILE: Mac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mac/Iter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
  IterAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Hosted/Mac
    dependencies:
      - target: Iter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITER_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Iter.app/Contents/MacOS/Iter
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Iter:
    build:
      targets:
        Iter: all
        IterAppTests: [test]
    run:
      config: Debug
    test:
      config: Test
      # Launch arguments of the host app while tests run: the in-memory store and a fixed place (Canyon Country), so a
      # test run never opens the real store and never asks for location.
      commandLineArguments:
        "-IterInMemoryStore YES": true
        "-IterLocation 38.39,-109.87": true
      targets:
        - IterAppTests
