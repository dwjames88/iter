# The iPhone and iPad app. Included from project.yml (`include: [project-ios.yml]`), so `xcodegen generate` makes one
# Iter.xcodeproj with both apps. All shared UI lives in the Packages/Iter package; iOS/ holds only the platform shell.
# scripts/test-ios.sh builds and tests the iOS app on the iOS 27.2 Simulator.
options:
  deploymentTarget:
    iOS: "26.0"
targets:
  Iter iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: iOS/Resources
    dependencies:
      - package: Iter
        product: IterScreens
      - package: Iter
        product: IterGoActivity
      - target: IterWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwjames.iter.ios
        PRODUCT_NAME: Iter
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        # Personal Team, automatic signing; the Simulator build needs no profile. On a device:
        # xcodebuild ... -allowProvisioningUpdates (see TESTING-iOS.md).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Built with the iOS 27 SDK, the @Generable code references FoundationModels symbols that iOS 26 lacks
        # (Generable.promptRepresentation), and a strong link stops the app at launch on iOS 26. A weak link lets it start;
        # Ask checks availability before using the model. See TESTING-iOS.md, "iOS 26".
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
  IterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Sources
    dependencies:
      - package: Iter
        product: IterModel
      - package: Iter
        product: IterUI
      - package: Iter
        product: IterGoActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwjames.iter.ios.widgets
        PRODUCT_NAME: IterWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
  IterAppTests iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Hosted/iOS
    dependencies:
      - target: Iter iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwjames.iter.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Iter.app/Iter
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Iter iOS:
    build:
      targets:
        Iter iOS: all
        IterAppTests iOS: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IterAppTests iOS
